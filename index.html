<!DOCTYPE html>
<html>
  <head>
    <title>Vue Hallo Welt</title>
    <!-- Import Vue 3 from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>{{ message }}</h1>
    </div>

    <script>
      const { createApp, ref } = Vue

      createApp({
        setup() {
          const message = ref('Hallo Welt!')
          return { message }
        }
      }).mount('#app')
    </script>
  </body>
</html>
